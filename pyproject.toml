[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "instrument-share-service"
version = "1.1.0"
description = "C/S RF instrument share queue with MQTT notify"
readme = "README.md"
requires-python = ">=3.8"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
include = ["core*", "instrument_queue_dev*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
